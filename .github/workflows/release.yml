name: Release

# Pushing a tag like v1.2.0 builds OpSec Bar and publishes a GitHub release with:
#   OpSecBar-Setup.exe      the installer
#   OpSecBar-win-x64.zip    the package the in-app updater downloads
# Both include the .NET runtime, so they work on a clean Windows 10/11 x64 PC.
# The tag must match <Version> in src/OpSecBar/OpSecBar.csproj.
#
# A test build tag like b20261112 (b + year, month, day; b20261112-2 for the second build of the day) publishes a
# GitHub pre-release instead. The tag is stamped into the app's InformationalVersion (e.g. 1.1.3-b20261112) so the
# in-app updater knows which build is installed. Only users with "Get pre-release updates" on receive it.
on:
  push:
    tags: ['v*', 'b*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check that the tag matches the project version
        id: version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $version = ([xml](Get-Content src/OpSecBar/OpSecBar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($ref -match '^b\d{8}(-\d+)?$') {
            "build=$ref" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } elseif ($ref.StartsWith('b')) {
            throw "Build tag $ref must look like b20261112 or b20261112-2."
          } else {
            $tag = $ref.TrimStart('v')
            if ($tag -ne $version) { throw "Tag v$tag does not match project version $version." }
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ steps.version.outputs.build }}') { $extra += '-p:InformationalVersion=${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}' }
          dotnet publish src/OpSecBar/OpSecBar.csproj -c Release -r win-x64 --self-contained true -o dist/OpSecBar @extra
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist/OpSecBar/* -DestinationPath OpSecBar-win-x64.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\OpSecBar.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpSecBar-Setup.exe
            OpSecBar-win-x64.zip
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
