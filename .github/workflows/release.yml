name: Release

# Pushing a tag like v1.2.0 builds OpSec Bar and publishes a GitHub release with the zip the in-app updater downloads.
# The tag must match <Version> in src/OpSecBar/OpSecBar.csproj.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = ([xml](Get-Content src/OpSecBar/OpSecBar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) { throw "Tag v$tag does not match project version $version." }

      - name: Publish
        run: dotnet publish src/OpSecBar/OpSecBar.csproj -c Release -r win-x64 --self-contained false -o dist/OpSecBar

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/OpSecBar/* -DestinationPath OpSecBar-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: OpSecBar-win-x64.zip
          generate_release_notes: true
